
{% extends "base.html" %}{% block content %}<section class="panel form-panel"><form method="post" enctype="multipart/form-data" class="grid-form">{% for key,label,typ,req in fields %}<label>{{label}}{% if typ=='textarea' %}<textarea name="{{key}}" {% if req %}required{% endif %}>{{item[key] or ''}}</textarea>{% elif typ=='select' %}<select name="{{key}}"><option>Disponível</option><option {% if item[key]=='Em uso' %}selected{% endif %}>Em uso</option><option {% if item[key]=='Em manutenção' %}selected{% endif %}>Em manutenção</option></select>{% else %}<input name="{{key}}" type="{{typ}}" value="{{item[key] or ''}}" {% if req %}required{% endif %}>{% endif %}</label>{% endfor %}<label>Foto do veículo (JPG, PNG ou WEBP)<input type="file" name="photo" accept=".jpg,.jpeg,.png,.webp,image/jpeg,image/png,image/webp">{% if item.photo %}<span class="field-hint">Foto atual:</span><img class="vehicle-photo-preview" src="{{url_for('uploaded_file',filename=item.photo)}}" alt="Foto atual do veículo">{% endif %}</label><div class="form-actions"><a class="button secondary" href="{{url_for('vehicles')}}">Cancelar</a><button class="primary">Salvar alterações</button></div></form></section>{% endblock %}
