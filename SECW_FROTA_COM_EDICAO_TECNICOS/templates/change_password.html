{% extends "base.html" %}{% set title='Alterar senha' %}{% block content %}<section class="panel form-panel"><h3>Atualizar minha senha</h3><p>Use uma senha com pelo menos 8 caracteres.</p><form method="post" class="grid-form"><label class="span2">Senha atual<input type="password" name="old_password" required autocomplete="current-password"></label><label>Nova senha<input type="password" name="new_password" minlength="8" required autocomplete="new-password"></label><label>Confirmar nova senha<input type="password" name="confirm_password" minlength="8" required autocomplete="new-password"></label><div class="form-actions"><button class="primary">Alterar senha</button></div></form></section>{% endblock %}
