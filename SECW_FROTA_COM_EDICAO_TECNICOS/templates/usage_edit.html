{% extends "base.html" %}{% set title='Editar saída de veículo' %}{% block content %}<section class="panel form-panel"><h3>Edição administrativa</h3><p>Esta alteração fica registrada na auditoria. A devolução continua no histórico original.</p><form method="post" class="grid-form"><label>Data e horário de saída *<input type="datetime-local" name="departure" value="{{item.departure[:16]}}" required></label><label>Quilometragem de saída *<input type="number" min="0" step=".1" name="km_out" value="{{item.km_out}}" required></label><label class="span2">Destino<input name="destination" value="{{item.destination or ''}}"></label><label class="span2">Observações da saída<textarea name="notes">{{item.notes or ''}}</textarea></label><div class="form-actions"><a class="button secondary" href="{{url_for('usage')}}">Cancelar</a><button class="primary">Salvar alterações</button></div></form></section>{% endblock %}
